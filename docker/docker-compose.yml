version: '3.8'

services:
  ocr-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paddleocr-service
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - USE_GPU=False
      - OCR_VERSION=PP-OCRv4
    volumes:
      - ../uploads:/app/uploads
      - ../outputs:/app/outputs
      - ../models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
