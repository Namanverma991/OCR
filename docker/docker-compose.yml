version: '3.8'

services:
  ocr-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paddleocr-service
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - OCR_ENABLED=true
      - OCR_VERSION=PP-OCRv4
      - OCR_DEVICE=cpu
      - USE_GPU=False
      - FLAGS_enable_pir_api=0
      - FLAGS_use_mkldnn=0
      - FLAGS_enable_onednn=0
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    volumes:
      - ../uploads:/app/uploads
      - ../outputs:/app/outputs
      - ../models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
